  <template id="appt-template">
   <div data-template-id="appt-card" class="canva-card flex items-center gap-3 p-3 rounded-xl" style="background:white;">
    <div class="w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0" style="background:var(--blush)"><i data-lucide="calendar-check" class="w-5 h-5" style="color:var(--rose)"></i>
    </div>
    <div class="flex-1 min-w-0">
     <p data-template-id="appt-card-service" class="canva-text font-medium text-sm truncate"></p>
     <p data-template-id="appt-card-detail" class="canva-text text-xs" style="color:var(--mauve)"></p>
    </div>
   </div>
  </template>
  <script src="/_sdk/editing_sdk.js"></script>
  <script>
    // State
    let selectedService = null;
    let selectedSpecialist = null;
    let selectedDate = null;
    let selectedTime = null;
    let allAppointments = [];
    let currentScreen = 'splash';

    const TIMES = ['09:00','09:30','10:00','10:30','11:00','11:30','12:00','14:00','14:30','15:00','15:30','16:00'];

    // Navigation
    function navigateTo(screen) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        const el = document.getElementById(screen + '-screen');
        if (el) { el.classList.add('active'); currentScreen = screen; }
        document.getElementById('bottom-nav').style.display = (screen === 'splash' || screen === 'confirm') ? 'none' : 'flex';
        document.querySelectorAll('.nav-item').forEach(n => {
            n.classList.remove('active');
            n.style.color = '#c9a0a0';
        });
        const activeNav = document.querySelector(`[data-nav="${screen}"]`);
        if (activeNav) { activeNav.classList.add('active'); activeNav.style.color = '#5c3d3d'; }
    }

    function goBack() {
        if (selectedService && !selectedSpecialist) navigateTo('services');
        else navigateTo('home');
    }

    // Splash auto-advance
    setTimeout(() => navigateTo('home'), 2200);

    // Service selection
    function selectServiceByName(name) {
        selectedService = name;
        document.querySelectorAll('.service-card').forEach(c => c.classList.remove('selected'));
        const card = document.querySelector(`[data-service="${name}"]`);
        if (card) card.classList.add('selected');
        navigateTo('booking');
        updateBookingSummary();
    }

    // Specialist selection
    function selectSpecialistByName(name) {
        selectedSpecialist = name;
        if (!selectedService) selectedService = 'Haircut & Styling';
        navigateTo('booking');
        updateBookingSummary();
    }

    function updateBookingSummary() {
        document.getElementById('booking-service-name').textContent = selectedService || 'Select a service';
        document.getElementById('booking-specialist-name').textContent = selectedSpecialist ? 'with ' + selectedSpecialist : 'Any available specialist';
    }

    // Date generation
    function buildDates() {
        const row = document.getElementById('date-row');
        row.innerHTML = '';
        const today = new Date();
        for (let i = 0; i < 14; i++) {
            const d = new Date(today);
            d.setDate(today.getDate() + i);
            const btn = document.createElement('button');
            btn.className = 'day-btn flex flex-col items-center px-3 py-2 rounded-xl flex-shrink-0 text-xs transition-colors';
            btn.style.background = '#fff';
            btn.style.color = '#5c3d3d';
            btn.style.minWidth = '52px';
            const day = d.toLocaleDateString('en-IN', { weekday: 'short' });
            const num = d.getDate();
            btn.innerHTML = `<span class="font-medium">${day}</span><span class="text-lg font-bold">${num}</span>`;
            const iso = d.toISOString().split('T')[0];
            btn.onclick = () => selectDate(iso, btn);
            row.appendChild(btn);
        }
    }

    function selectDate(iso, btn) {
        selectedDate = iso;
        document.querySelectorAll('.day-btn').forEach(b => { b.classList.remove('selected'); b.style.background = '#fff'; b.style.color = '#5c3d3d'; });
        btn.classList.add('selected');
        buildTimes();
        checkConfirm();
    }

    function buildTimes() {
        const grid = document.getElementById('time-grid');
        grid.innerHTML = '';
        TIMES.forEach(t => {
            const btn = document.createElement('button');
            btn.className = 'time-slot px-3 py-2.5 rounded-xl text-xs font-medium transition-colors';
            btn.style.background = '#fff';
            btn.style.color = '#5c3d3d';
            btn.textContent = t;
            btn.onclick = () => selectTime(t, btn);
            grid.appendChild(btn);
        });
    }

    function selectTime(t, btn) {
        selectedTime = t;
        document.querySelectorAll('.time-slot').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        checkConfirm();
    }

    function checkConfirm() {
        document.getElementById('confirm-btn').disabled = !(selectedDate && selectedTime);
    }

    // Booking confirmation
    async function confirmBooking() {
        const name = document.getElementById('cust-name').value.trim() || 'Guest';
        const email = document.getElementById('cust-email').value.trim() || '';
        if (allAppointments.length >= 999) {
            showError('Maximum appointments reached. Please delete some first.');
            return;
        }
        const btn = document.getElementById('confirm-btn');
        btn.disabled = true;
        btn.textContent = 'Booking...';

        const result = await window.dataSdk.create({
            customer_name: name,
            customer_email: email,
            service_name: selectedService || 'General',
            specialist_name: selectedSpecialist || 'Any',
            appointment_date: selectedDate,
            appointment_time: selectedTime,
            status: 'confirmed',
            created_at: new Date().toISOString()
        });

        btn.textContent = 'Confirm Booking';
        if (result.isOk) {
            document.getElementById('conf-service').textContent = selectedService;
            document.getElementById('conf-specialist').textContent = selectedSpecialist || 'Any available';
            const dateObj = new Date(selectedDate + 'T00:00:00');
            document.getElementById('conf-date').textContent = dateObj.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'short' });
            document.getElementById('conf-time').textContent = selectedTime;
            navigateTo('confirm');
            selectedDate = null; selectedTime = null;
        } else {
            showError('Booking failed. Please try again.');
            btn.disabled = false;
        }
    }

    function showError(msg) {
        const el = document.getElementById('booking-error');
        el.classList.remove('hidden');
        el.querySelector('p').textContent = msg;
        setTimeout(() => el.classList.add('hidden'), 3000);
    }

    // Render appointments
    function renderAppointments(data) {
        const list = document.getElementById('appointments-list');
        const noAppt = list.querySelector('[data-template-id="no-appointments"]');
        // Remove old dynamic cards
        list.querySelectorAll('.appt-dynamic').forEach(e => e.remove());
        if (data.length === 0) { if (noAppt) noAppt.style.display = ''; return; }
        if (noAppt) noAppt.style.display = 'none';
        const tpl = document.getElementById('appt-template');
        const sorted = [...data].sort((a, b) => (a.appointment_date || '').localeCompare(b.appointment_date || ''));
        sorted.forEach(appt => {
            const clone = tpl.content.cloneNode(true);
            const card = clone.querySelector('[data-template-id="appt-card"]');
            card.classList.add('appt-dynamic');
            clone.querySelector('[data-template-id="appt-card-service"]').textContent = appt.service_name || 'Service';
            const d = appt.appointment_date ? new Date(appt.appointment_date + 'T00:00:00') : null;
            const dateStr = d ? d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) : '';
            clone.querySelector('[data-template-id="appt-card-detail"]').textContent = `${appt.specialist_name || 'Specialist'} · ${dateStr} ${appt.appointment_time || ''}`;
            list.appendChild(clone);
        });
        lucide.createIcons();
    }

    // Search
    document.addEventListener('DOMContentLoaded', () => {
        buildDates();
        buildTimes();
        updateBookingSummary();
        lucide.createIcons();

        const searchInput = document.getElementById('search-input');
        if (searchInput) {
            searchInput.addEventListener('input', (e) => {
                const q = e.target.value.toLowerCase();
                document.querySelectorAll('#services-list .service-card').forEach(card => {
                    const name = card.dataset.service.toLowerCase();
                    card.style.display = name.includes(q) ? '' : 'none';
                });
                if (q.length > 0) navigateTo('services');
            });
        }
    });

    // Data SDK
    const dataHandler = {
        onDataChanged(data) {
            allAppointments = data;
            renderAppointments(data);
        }
    };
    (async () => {
        const res = await window.dataSdk.init(dataHandler);
        if (!res.isOk) console.error('Data SDK init failed');
    })();
</script>
